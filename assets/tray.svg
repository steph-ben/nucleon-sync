<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="The nucleon-sync tray icon and its menu on a Linux desktop, next to the recent activity window">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16233a"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <linearGradient id="b" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <g id="logo">
      <path d="M64 10a54 54 0 0 1 46.8 27" fill="none" stroke="url(#a)" stroke-width="8" stroke-linecap="round"/>
      <path d="M116 22l-4 18-17-7z" fill="#0ea5e9"/>
      <path d="M64 118a54 54 0 0 1-46.8-27" fill="none" stroke="url(#b)" stroke-width="8" stroke-linecap="round"/>
      <path d="M12 106l4-18 17 7z" fill="#f59e0b"/>
      <circle cx="50" cy="64" r="22" fill="url(#a)"/>
      <circle cx="78" cy="64" r="22" fill="url(#b)" fill-opacity=".92"/>
    </g>
    <g id="syncing">
      <use href="#logo"/>
      <circle cx="101" cy="101" r="26" fill="#0ea5e9" stroke="#0b1220" stroke-opacity=".25" stroke-width="3"/>
      <path d="M90 96a13 13 0 0 1 22-3M114 104a13 13 0 0 1-22 3" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M114 86v9h-9zM88 114v-9h9z" fill="#fff"/>
    </g>
  </defs>
  <rect width="900" height="440" rx="20" fill="url(#bg)"/>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Cantarell, Helvetica, Arial, sans-serif" font-size="13">
    <!-- top bar -->
    <path d="M0 20a20 20 0 0 1 20-20h860a20 20 0 0 1 20 20v14H0z" fill="#000" fill-opacity=".55"/>
    <text x="28" y="22" fill="#e2e8f0" font-weight="600">Activities</text>
    <text x="450" y="22" fill="#e2e8f0" text-anchor="middle" font-weight="600">Mon 9 Nov  10:42</text>
    <rect x="693" y="4" width="28" height="26" rx="6" fill="#fff" fill-opacity=".18"/>
    <use href="#syncing" transform="translate(697 7) scale(.16)"/>
    <circle cx="748" cy="17" r="5" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M790 11v12M784 17h12" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M830 23h20M836 17h14M842 11h8" stroke="#e2e8f0" stroke-width="2"/>

    <!-- recent activity window -->
    <g transform="translate(36 70)">
      <rect width="504" height="330" rx="12" fill="#1e1e1e" stroke="#ffffff" stroke-opacity=".08"/>
      <path d="M0 12a12 12 0 0 1 12-12h480a12 12 0 0 1 12 12v26H0z" fill="#2b2b2b"/>
      <text x="252" y="24" fill="#f1f5f9" text-anchor="middle" font-weight="600">nucleon-sync: recent activity</text>
      <circle cx="484" cy="19" r="8" fill="#3a3a3a"/><path d="M480.5 15.5l7 7M487.5 15.5l-7 7" stroke="#e2e8f0" stroke-width="1.6"/>
      <g fill="#94a3b8" font-weight="600"><text x="16" y="62">When</text><text x="134" y="62">Action</text><text x="318" y="62">File</text></g>
      <path d="M0 72h504" stroke="#fff" stroke-opacity=".08"/>
      <g fill="#e2e8f0">
        <text x="16" y="98">09/11 10:41:12</text><text x="134" y="98">Uploaded</text><text x="318" y="98">Photos/2026/beach.jpg</text>
        <text x="16" y="130">09/11 10:40:58</text><text x="134" y="130">Moved on Drive</text><text x="318" y="130">Work/Archive/Reports</text>
        <text x="16" y="162">09/11 10:31:05</text><text x="134" y="162">Downloaded (new version)</text><text x="318" y="162">Notes/todo.md</text>
        <text x="16" y="194">09/11 09:58:40</text><text x="134" y="194" fill="#fbbf24">Conflict: copy created</text><text x="318" y="194">Budget.ods</text>
        <text x="16" y="226">09/11 09:12:03</text><text x="134" y="226">Moved to trash</text><text x="318" y="226">Drafts/old-plan.txt</text>
        <text x="16" y="258">09/11 08:47:19</text><text x="134" y="258">Folder created here</text><text x="318" y="258">Travel/Lisbon</text>
        <text x="16" y="290">09/11 08:47:18</text><text x="134" y="290">Downloaded</text><text x="318" y="290">Travel/Lisbon/tickets.pdf</text>
      </g>
    </g>

    <!-- tray menu -->
    <g transform="translate(566 40)">
      <rect width="300" height="340" rx="12" fill="#2b2b2b" stroke="#ffffff" stroke-opacity=".1"/>
      <use href="#logo" transform="translate(16 13) scale(.14)"/>
      <text x="46" y="31" fill="#94a3b8">nucleon-sync 0.2.3</text>
      <path d="M8 46h284" stroke="#fff" stroke-opacity=".1"/>
      <use href="#syncing" transform="translate(16 57) scale(.14)"/>
      <text x="46" y="75" fill="#f1f5f9" font-weight="600">Syncing 3/12</text>
      <text x="46" y="105" fill="#94a3b8">Uploading Photos/2026/beach.jpg</text>
      <text x="46" y="135" fill="#94a3b8">Last sync: 2 min ago</text>
      <path d="M8 152h284" stroke="#fff" stroke-opacity=".1"/>
      <g fill="none" stroke="#e2e8f0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 168v12M29 168v12"/>
        <circle cx="26" cy="204" r="7"/><path d="M26 200v4l3 2"/>
        <path d="M19 228h5l2 2h7v9H19z"/>
        <path d="M21 255h8l3 3v11H21zM24 262h6M24 266h6"/>
        <path d="M26 312v6M21 314a7 7 0 1 0 10 0"/>
      </g>
      <rect x="6" y="160" width="288" height="28" rx="6" fill="#fff" fill-opacity=".08"/>
      <g fill="#f1f5f9">
        <text x="46" y="179">Pause</text>
        <text x="46" y="209">Recent activity…</text>
        <text x="46" y="239">Open folder</text>
        <text x="46" y="269">Open technical log</text>
      </g>
      <path d="M8 290h284" stroke="#fff" stroke-opacity=".1"/>
      <text x="46" y="321" fill="#f1f5f9">Quit icon</text>
    </g>
  </g>
</svg>
