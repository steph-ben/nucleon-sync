name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and type checking (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same as scripts/install.sh for dependencies, without links or services.
      - name: Dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          bash scripts/patch-crypto.sh

      - name: Main tests
        run: bun test test/local.test.ts test/scenarios.test.ts test/integration.test.ts test/proton-adapter.test.ts test/journal.test.ts

      - name: Fuzz tests
        run: bun test test/fuzz.test.ts

      # Errors from node_modules/@protontech/crypto are known: only those
      # from src/ and test/ fail the job.
      - name: Type checking
        run: |
          npx tsc --noEmit > "$RUNNER_TEMP/tsc.log" 2>&1 || true
          if grep -E "^(src|test)/" "$RUNNER_TEMP/tsc.log"; then
            echo "Type errors in src/ or test/" >&2
            exit 1
          fi
          echo "No type errors in src/ or test/."
